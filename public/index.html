<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web → APK Converter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
      animation: bgShift 15s ease infinite alternate;
      background-size: 400% 400%;
    }
    @keyframes bgShift {
      0% { background: linear-gradient(45deg, #0a0a0a, #1a0033, #0d0d0d); }
      25% { background: linear-gradient(135deg, #1a0033, #0a0a0a, #003366); }
      50% { background: linear-gradient(225deg, #003366, #1a0033, #330033); }
      75% { background: linear-gradient(315deg, #330033, #003366, #0a0a0a); }
      100% { background: linear-gradient(405deg, #0a0a0a, #1a0033, #003366); }
    }
    .container {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 2.5rem 3rem;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(0, 180, 255, 0.2);
      border: 1px solid rgba(255,255,255,0.15);
      transition: box-shadow 0.3s;
    }
    h1 {
      text-align: center;
      color: #fff;
      font-weight: 300;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(0, 180, 255, 0.6);
      margin-bottom: 1.5rem;
      font-size: 2rem;
    }
    h1 span { color: #00c8ff; font-weight: 600; }
    .form-group {
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      color: #ccc;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      letter-spacing: 0.5px;
    }
    input[type="text"], input[type="email"], input[type="password"], input[type="file"] {
      width: 100%;
      padding: 0.8rem 1rem;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.07);
      color: #fff;
      font-size: 1rem;
      outline: 1px solid rgba(255,255,255,0.1);
      transition: 0.3s;
    }
    input:focus {
      outline: 1px solid #00c8ff;
      box-shadow: 0 0 20px rgba(0, 200, 255, 0.2);
    }
    input[type="file"] { padding: 0.6rem; }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: #ccc;
    }
    .checkbox-group input { width: auto; }
    .hint {
      color: #888;
      font-size: 0.8rem;
      margin-top: 0.2rem;
    }
    button {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #00c8ff, #0066ff);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 0.5rem;
      box-shadow: 0 0 30px rgba(0, 200, 255, 0.3);
    }
    button:hover { transform: scale(1.02); box-shadow: 0 0 50px rgba(0, 200, 255, 0.6); }
    #status {
      margin-top: 1.5rem;
      text-align: center;
      color: #aaa;
      font-size: 0.95rem;
      min-height: 2rem;
    }
    .loader {
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #00c8ff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
      display: none;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .success { color: #00ff88; }
    .error { color: #ff4466; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌐 <span>Web</span> → <span>APK</span></h1>
    <form id="convertForm" enctype="multipart/form-data">
      <div class="form-group">
        <label>Website URL</label>
        <input type="text" name="url" placeholder="https://example.com" required>
      </div>
      <div class="form-group">
        <label>App Name</label>
        <input type="text" name="name" placeholder="My App" required>
      </div>
      <div class="form-group">
        <label>Version</label>
        <input type="text" name="version" placeholder="1.0.0" value="1.0.0">
      </div>
      <div class="form-group">
        <label>Your Email (to receive the APK link)</label>
        <input type="email" name="recipient_email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Your Email Password (App Password if using Gmail)</label>
        <input type="password" name="sender_password" placeholder="Your app password" required>
        <div class="hint">🔑 For Gmail, enable 2‑FA and generate an <a href="https://myaccount.google.com/apppasswords" target="_blank" style="color:#00c8ff;">App Password</a>.</div>
      </div>
      <div class="form-group">
        <label>App Icon (PNG, 512x512)</label>
        <input type="file" name="icon" accept="image/png">
      </div>
      <div class="form-group">
        <label>Splash Screen Image (PNG, 1242x2208)</label>
        <input type="file" name="splash" accept="image/png">
      </div>
      <div class="form-group checkbox-group">
        <input type="checkbox" name="notifications" id="notif">
        <label for="notif">Enable Push Notifications</label>
      </div>
      <button type="submit">⚡ Convert & Send</button>
    </form>
    <div id="status"></div>
    <div class="loader" id="loader"></div>
  </div>
  <script>
    document.getElementById('convertForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status');
      const loader = document.getElementById('loader');
      status.innerHTML = '';
      loader.style.display = 'block';

      const formData = new FormData(e.target);
      try {
        const res = await fetch('/convert', { method: 'POST', body: formData });
        const data = await res.json();
        if (res.ok) {
          status.innerHTML = `<span class="success">✅ ${data.message}</span>`;
        } else {
          status.innerHTML = `<span class="error">❌ ${data.error || 'Something went wrong'}</span>`;
        }
      } catch (err) {
        status.innerHTML = `<span class="error">❌ Network error. Please try again.</span>`;
      } finally {
        loader.style.display = 'none';
      }
    });
  </script>
</body>
</html>
